<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리집 서랍</title>
<meta name="description" content="가족이 함께 쓰는 우리집 서랍 — 가계부(지출·수입 기록, 월별 통계, 예산과 고정지출)부터">
<meta property="og:title" content="우리집 서랍">
<meta property="og:description" content="가족이 함께 쓰는 우리집 서랍 — 가계부부터">
<meta property="og:site_name" content="우리집 서랍">
<meta property="og:type" content="website">
<meta property="og:url" content="https://2juwon.github.io/family-book/">
<meta property="og:image" content="https://2juwon.github.io/family-book/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리집 서랍">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  color-scheme:light;
  --bg:#f6f4ef; --card:#fffdf9; --line:#e9e5dc; --ink:#1d1c1a; --ink2:#5d5a54; --ink3:#8f8b83;
  --brand:#2f6b4f; --brand-soft:#e3efe7; --out:#eb6834; --in:#2a78d6; --out-ink:#c4471a; --in-ink:#1f63b5;
  --good:#1e8a4c; --warn:#c98500; --bad:#d43c3b; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(60,50,30,.06);
  --r:18px; --on-brand:#fff;
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --bg:#141413; --card:#1f1f1d; --line:#2f2f2c; --ink:#f0efec; --ink2:#c3c2b7; --ink3:#8b8a82;
  --brand:#6fbf95; --brand-soft:#21362b; --out:#d95926; --in:#3987e5; --out-ink:#f08a5f; --in-ink:#6aa8f0;
  --good:#4cc07c; --warn:#e0a52a; --bad:#e66767; --shadow:0 1px 2px rgba(0,0,0,.3); --on-brand:#10251a;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--brand)}
.num{font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}

/* 시작 화면 */
.start{padding:48px 22px 40px}
.start h1{font-size:30px;margin:12px 0 6px;font-weight:800}
.start .lead{color:var(--ink2);margin:0 0 28px;line-height:1.55}
.logo{font-size:52px}
.seg{display:flex;background:var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px 0;border-radius:11px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.field{margin:14px 0}
.field label{display:block;font-size:14px;color:var(--ink2);margin:0 0 6px;font-weight:600}
.field .hint{font-size:13px;color:var(--ink3);margin-top:6px}
.btn{display:block;width:100%;padding:15px;border-radius:14px;background:var(--brand);color:var(--on-brand);font-weight:700;font-size:17px}
.btn:disabled{opacity:.5}
.btn.ghost{background:var(--brand-soft);color:var(--brand)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:10px 0}

/* 머리 */
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px}
.top{display:flex;align-items:center;justify-content:space-between}
.fam{font-size:15px;font-weight:700;color:var(--ink2);max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me{font-size:13px;color:var(--ink3)}
.monthbar{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px}
.monthbar b{font-size:20px;min-width:128px;text-align:center}
.monthbar button{width:40px;height:40px;border-radius:50%;font-size:20px;color:var(--ink2)}
.monthbar button:active{background:var(--line)}
.today-btn{font-size:12px!important;width:auto!important;padding:0 10px;height:28px!important;border-radius:14px!important;background:var(--line);color:var(--ink2)}

main{padding:4px 16px 16px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:16px}
.card h3 small{font-weight:500;color:var(--ink3);font-size:13px;margin-left:6px}
.summary .big{font-size:30px;font-weight:800;margin:2px 0 14px}
.summary .lbl{font-size:13px;color:var(--ink2)}
.sumrow{display:flex;gap:10px}
.sumrow>div{flex:1;background:var(--bg);border-radius:12px;padding:10px 12px}
.sumrow .v{font-weight:700;margin-top:2px}
.o{color:var(--out-ink)} .i{color:var(--in-ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;color:var(--ink2)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.day{margin:16px 2px 6px;display:flex;justify-content:space-between;font-size:13px;color:var(--ink3);font-weight:600}
.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left}
.row+.row{border-top:1px solid var(--line)}
.row:active{background:var(--bg)}
.ic{flex:none;width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:20px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{font-size:13px;color:var(--ink3)}
.row .a{font-weight:700;white-space:nowrap}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--brand-soft);color:var(--brand);margin-left:4px;vertical-align:1px}
.empty{text-align:center;color:var(--ink3);padding:48px 12px;line-height:1.7}
.empty .e{font-size:42px}

/* 아래 탭 */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:560px;margin:0 auto;display:flex}
nav button{flex:1;padding:9px 0 8px;font-size:12px;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ni{font-size:21px;filter:grayscale(1);opacity:.6}
nav button.on{color:var(--ink);font-weight:700}
nav button.on .ni{filter:none;opacity:1}
.fab{position:fixed;z-index:7;right:max(18px,calc(50% - 262px));bottom:calc(76px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;background:var(--brand);color:var(--on-brand);font-size:32px;box-shadow:0 6px 20px rgba(47,107,79,.35);display:grid;place-items:center}
.fab:active{transform:scale(.95)}

/* 시트 */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;opacity:0;transition:opacity .2s}
.dim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;max-height:92vh;overflow-y:auto;padding:10px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:19px;margin:4px 0 14px;display:flex;justify-content:space-between;align-items:center}
.sheet h2 button{font-size:22px;color:var(--ink3);width:36px;height:36px}
.amt{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line);padding:6px 2px;margin:8px 0 10px}
.amt:focus-within{border-color:var(--brand)}
.amt input{border:0;background:none;padding:0;font-size:32px;font-weight:800;text-align:right;flex:1;min-width:0}
.amt span{font-size:20px;font-weight:700;color:var(--ink2)}
.quick{display:flex;gap:6px;margin-bottom:14px}
.quick button{flex:1;padding:8px 0;border-radius:10px;background:var(--bg);font-size:13px;color:var(--ink2);font-weight:600}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.cats button{padding:10px 2px 8px;border-radius:12px;border:1.5px solid transparent;background:var(--bg);font-size:12px;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:3px;word-break:keep-all}
.cats button .ce{font-size:22px}
.cats button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--ink);font-weight:700}
.two{display:flex;gap:10px}
.two>*{flex:1}
.mt{margin-top:14px}
.row2{display:flex;gap:8px;margin-top:16px}
.row2 .btn{flex:1}

/* 통계 */
.bars .br{display:grid;grid-template-columns:28px 1fr auto;gap:4px 10px;align-items:center;padding:8px 0}
.bars .br+.br{border-top:1px solid var(--line)}
.bars .nm{font-size:14px;font-weight:600}
.bars .nm small{color:var(--ink3);font-weight:500;margin-left:4px}
.bars .vv{text-align:right;font-weight:700;font-size:14px}
.bars .track{grid-column:2/4;height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.bars .fill{height:100%;border-radius:4px}
.bars .dl{grid-column:2/4;font-size:12px;color:var(--ink3);margin-top:-2px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--ink2);margin:-4px 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--ink3);font-size:11px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:7px 9px;border-radius:9px;white-space:nowrap;transform:translate(-50%,-100%);line-height:1.5;display:none}

/* 예산 */
.prog{height:12px;border-radius:6px;background:var(--bg);overflow:hidden;margin:10px 0 6px}
.prog i{display:block;height:100%;border-radius:6px}
.stat{font-size:13px;font-weight:600}
.fx{display:flex;align-items:center;gap:12px;padding:12px 0}
.fx+.fx{border-top:1px solid var(--line)}
.fx .d{flex:none;width:42px;text-align:center;font-size:12px;color:var(--ink3);font-weight:600}
.fx .d b{display:block;font-size:17px;color:var(--ink)}
.fx.off{opacity:.45}
.switch{position:relative;width:46px;height:28px;border-radius:14px;background:var(--line);flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--brand)}
.switch.on::after{transform:translateX(18px)}
.addline{display:block;width:100%;padding:12px;margin-top:8px;border-radius:12px;border:1.5px dashed var(--line);color:var(--ink2);font-weight:600}
.bcat{display:flex;align-items:center;gap:10px;padding:6px 0}
.bcat .nm{flex:1;font-size:14px}
.bcat input{width:130px;text-align:right;padding:9px 10px}

/* 설정 */
.code{font-size:34px;font-weight:800;letter-spacing:.18em;text-align:center;margin:6px 0 4px;color:var(--brand)}
.mlist{display:flex;flex-wrap:wrap;gap:6px}
.mlist span{padding:6px 12px;border-radius:999px;background:var(--bg);font-size:14px}
.catm{display:flex;flex-wrap:wrap;gap:6px}
.catm span{display:inline-flex;align-items:center;gap:4px;padding:6px 6px 6px 10px;border-radius:999px;background:var(--bg);font-size:14px}
.catm span button{width:22px;height:22px;border-radius:50%;color:var(--ink3);font-size:14px}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:13px 0;width:100%;text-align:left;font-weight:600}
.setrow+.setrow{border-top:1px solid var(--line)}
.setrow span{color:var(--ink3);font-weight:500}
.soon{color:var(--ink3);font-size:14px;line-height:1.6}

.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;opacity:0;transition:all .25s;z-index:40;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.loading{position:fixed;top:0;left:0;height:3px;background:var(--brand);z-index:50;width:0;transition:width .4s}
.install{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.install img{width:48px;height:48px;border-radius:12px;flex:none}
.install b{display:block}
.install span{font-size:13px;color:var(--ink3)}
.install .go{margin-left:auto;flex:none;padding:9px 14px;border-radius:10px;background:var(--brand);color:var(--on-brand);font-weight:700;font-size:14px}
.steps{margin:4px 0 0;padding-left:22px;line-height:1.9;color:var(--ink2)}
.steps b{color:var(--ink)}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="loading" id="loading"></div>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
// ───────── 설정 ─────────
const PROD_API = "https://family-book.2juwon.workers.dev";
const API = new URLSearchParams(location.search).get("api") ||
  (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? "http://127.0.0.1:8787" : PROD_API);
const LS_AUTH = "fb.auth.v1";
const METHODS = ["카드", "현금", "이체"];
const WEEK = ["일", "월", "화", "수", "목", "금", "토"];

// ───────── 상태 ─────────
const S = { auth: load(LS_AUTH), month: null, data: null, tab: "list", filter: "all", statType: "out", busy: 0 };

function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
function save(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch {} }
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const won = (n) => Math.round(n).toLocaleString("ko-KR");
function short(n) {
  const a = Math.abs(n);
  if (a >= 1e8) return (n / 1e8).toFixed(a >= 1e9 ? 0 : 1).replace(/\.0$/, "") + "억";
  if (a >= 1e4) return Math.round(n / 1e4).toLocaleString("ko-KR") + "만";
  return won(n);
}
function kstToday() { return new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10); }
function addMonths(ym, k) {
  let [y, m] = ym.split("-").map(Number); m += k;
  while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; }
  return `${y}-${String(m).padStart(2, "0")}`;
}
const monthLabel = (ym) => `${+ym.slice(0, 4)}년 ${+ym.slice(5)}월`;
function dayLabel(d) {
  const dt = new Date(d + "T00:00:00");
  const t = kstToday();
  const rel = d === t ? " · 오늘" : d === addDays(t, -1) ? " · 어제" : "";
  return `${+d.slice(5, 7)}월 ${+d.slice(8)}일 (${WEEK[dt.getDay()]})${rel}`;
}
function addDays(d, k) { const x = new Date(d + "T00:00:00Z"); x.setUTCDate(x.getUTCDate() + k); return x.toISOString().slice(0, 10); }
function daysIn(ym) { const [y, m] = ym.split("-").map(Number); return new Date(Date.UTC(y, m, 0)).getUTCDate(); }

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2200);
}
// ───────── 앱으로 설치 ─────────
const INSTALL = { prompt: null };
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const canInstall = () => !isStandalone() && (INSTALL.prompt || isIOS());
// 크롬 기본 설치 안내도 그대로 뜨게 preventDefault는 하지 않음 — 이벤트만 잡아 둠
// 시작 화면에선 입력 중인 글이 지워지지 않게 버튼만 보이고 숨김
function installChanged() {
  if (!S.auth) { const b = $("#startInstall"); if (b) b.hidden = !canInstall(); }
  else if (S.tab === "set") render();
}
window.addEventListener("beforeinstallprompt", (e) => { INSTALL.prompt = e; installChanged(); });
window.addEventListener("appinstalled", () => { INSTALL.prompt = null; installChanged(); toast("홈 화면에 설치했어요"); });
function installCard() {
  if (!canInstall()) return "";
  return `<div class="card"><button class="install" data-act="install">
    <img src="icon-192.png" alt=""><span style="flex:1"><b>앱으로 설치하기</b><span>홈 화면에서 바로 열어요</span></span><span class="go">설치</span>
  </button></div>`;
}
async function doInstall() {
  if (INSTALL.prompt) {
    const p = INSTALL.prompt;
    p.prompt();
    const r = await p.userChoice.catch(() => null);
    if (r?.outcome === "accepted") INSTALL.prompt = null;
    installChanged();
    return;
  }
  const ipad = /ipad/i.test(navigator.userAgent) || navigator.maxTouchPoints > 1 && !/iphone/i.test(navigator.userAgent);
  const safari = !/crios|fxios|edgios|kakaotalk|naver|instagram|fban|line/i.test(navigator.userAgent);
  openSheet(`<h2>홈 화면에 추가하기<button data-close aria-label="닫기">✕</button></h2>
    ${safari ? "" : `<div class="soon" style="margin-bottom:10px;color:var(--bad)">지금 앱 안 브라우저(카톡 등)로 열려 있어요. 오른쪽 아래·위 메뉴에서 <b>Safari로 열기</b>를 먼저 눌러 주세요.</div>`}
    <ol class="steps">
      <li>Safari ${ipad ? "주소창 오른쪽" : "아래쪽"}의 <b>공유 버튼</b>(네모에 위 화살표)을 눌러요</li>
      <li>목록을 내려 <b>홈 화면에 추가</b>를 눌러요</li>
      <li>오른쪽 위 <b>추가</b>를 누르면 끝!</li>
    </ol>
    <button class="btn mt" data-close>알겠어요</button>`);
}

function busy(on) {
  S.busy += on ? 1 : -1;
  const l = $("#loading");
  if (S.busy > 0) { l.style.opacity = 1; l.style.width = "70%"; }
  else { l.style.width = "100%"; setTimeout(() => { if (!S.busy) { l.style.opacity = 0; l.style.width = 0; } }, 300); }
}

// ───────── 서버 ─────────
async function api(method, path, body) {
  busy(true);
  try {
    const res = await fetch(API + path, {
      method,
      headers: { "Content-Type": "application/json", ...(S.auth ? { Authorization: "Bearer " + S.auth.token } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401 && S.auth) { logout(true); throw new Error(data.error || "다시 로그인해 주세요"); }
    if (!res.ok) throw new Error(data.error || "문제가 생겼어요");
    return data;
  } catch (e) {
    if (e instanceof TypeError) throw new Error("인터넷 연결을 확인해 주세요");
    throw e;
  } finally { busy(false); }
}

async function refresh() {
  const month = S.month;
  try {
    const d = await api("GET", "/api/state?month=" + month);
    if (month !== S.month) return;
    S.data = d;
    if (d.family?.name && S.auth.name !== d.family.name) { S.auth.name = d.family.name; save(LS_AUTH, S.auth); }
    save("fb.cache." + S.auth.code, { month, data: d });
    render();
  } catch (e) { toast(e.message); }
}

function logout(silent) {
  if (!silent && S.auth) api("POST", "/api/logout").catch(() => {});
  if (S.auth) save("fb.cache." + S.auth.code, null);
  S.auth = null; S.data = null; save(LS_AUTH, null);
  closeSheet(); render();
  if (silent) toast("다시 로그인해 주세요");
}

// ───────── 분류 도우미 ─────────
function cats(type) { return (S.data?.categories || []).filter((c) => !type || c.type === type); }
function catOf(id) {
  return (S.data?.categories || []).find((c) => c.id === id) || { id, name: "지운 분류", icon: "📦" };
}

// ───────── 그리기 ─────────
function render() {
  const app = $("#app");

      ${S.tab === "set" ? "" : `<div class="monthbar">
        <button data-act="prev" aria-label="이전 달">‹</button><b>${monthLabel(S.month)}</b>
        <button data-act="next" aria-label="다음 달">›</button>
        ${S.month !== kstToday().slice(0, 7) ? `<button class="today-btn" data-act="thism">이번 달</button>` : ""}
      </div>`}
    </header>
    <main>${!d ? `<div class="empty"><div class="e">⏳</div>불러오는 중…</div>` :
      S.tab === "list" ? viewList(d) : S.tab === "stat" ? viewStat(d) : S.tab === "budget" ? viewBudget(d) : viewSet(d)}</main>
    ${S.tab === "set" ? "" : `<button class="fab" data-act="add" aria-label="기록 추가">+</button>`}
    <nav><div class="in">
      ${[["list", "📒", "내역"], ["stat", "📊", "통계"], ["budget", "🎯", "예산"], ["set", "⚙️", "설정"]].map(([k, i, n]) =>
        `<button data-tab="${k}" class="${S.tab === k ? "on" : ""}"><span class="ni">${i}</span>${n}</button>`).join("")}
    </div></nav>`;
  if (d && S.tab === "stat") mountTrend(d);
}

function totals(entries) {
  let out = 0, inn = 0;
  for (const e of entries) e.type === "in" ? (inn += e.amount) : (out += e.amount);
  return { out, inn };
}

function viewList(d) {
  const { out, inn } = totals(d.entries);
  const list = d.entries.filter((e) => S.filter === "all" || e.type === S.filter);
  const groups = [];
  for (const e of list) {
    let g = groups[groups.length - 1];
    if (!g || g.date !== e.date) groups.push((g = { date: e.date, items: [], out: 0, inn: 0 }));
    g.items.push(e); e.type === "in" ? (g.inn += e.amount) : (g.out += e.amount);
  }
  return `
    <div class="card summary">
      <div class="lbl">이번 달 쓴 돈</div>
      <div class="big num o">${won(out)}원</div>
      <div class="sumrow">
        <div><div class="lbl">들어온 돈</div><div class="v num i">${won(inn)}원</div></div>
        <div><div class="lbl">남은 돈</div><div class="v num">${inn - out < 0 ? "−" : ""}${won(Math.abs(inn - out))}원</div></div>
      </div>
    </div>
    <div class="chips">${[["all", "전체"], ["out", "지출"], ["in", "수입"]].map(([k, n]) =>
      `<button class="chip ${S.filter === k ? "on" : ""}" data-filter="${k}">${n}</button>`).join("")}</div>
    ${!groups.length ? `<div class="empty"><div class="e">📝</div>${d.entries.length ? "해당하는 기록이 없어요" : "아직 기록이 없어요<br>아래 <b>+</b> 버튼으로 첫 기록을 남겨 보세요"}</div>` :
      groups.map((g) => `
        <div class="day"><span>${dayLabel(g.date)}</span><span class="num">${g.out ? `<span class="o">−${won(g.out)}</span>` : ""}${g.inn ? ` <span class="i">+${won(g.inn)}</span>` : ""}</span></div>
        <div class="list">${g.items.map(rowHTML).join("")}</div>`).join("")}`;
}

function rowHTML(e) {
  const c = catOf(e.cat);
  const sub = [c.name, e.method, e.member].filter(Boolean).join(" · ");
  return `<button class="row" data-edit="${e.id}">
    <span class="ic">${esc(c.icon)}</span>
    <span class="t"><b>${esc(e.memo || c.name)}${e.fixed_id ? `<span class="tag">고정</span>` : ""}</b><span>${esc(sub)}</span></span>
    <span class="a num ${e.type === "in" ? "i" : "o"}">${e.type === "in" ? "+" : "−"}${won(e.amount)}</span>
  </button>`;
}

function viewStat(d) {
  const type = S.statType;
  const by = {};
  let total = 0;
  for (const e of d.entries) if (e.type === type) { by[e.cat] = (by[e.cat] || 0) + e.amount; total += e.amount; }
  const prev = {};
  for (const p of d.prevCats) if (p.type === type) prev[p.cat] = p.sum;
  const prevTotal = Object.values(prev).reduce((a, b) => a + b, 0);
  const rows = Object.entries(by).sort((a, b) => b[1] - a[1]);
  const max = rows[0]?.[1] || 1;
  const color = type === "out" ? "var(--out)" : "var(--in)";
  const diff = total - prevTotal;
  return `
    <div class="chips">${[["out", "지출"], ["in", "수입"]].map(([k, n]) =>
      `<button class="chip ${S.statType === k ? "on" : ""}" data-stat="${k}">${n}</button>`).join("")}</div>
    <div class="card">
      <h3>분류별 ${type === "out" ? "지출" : "수입"}<small>${monthLabel(S.month)}</small></h3>
      <div class="summary"><div class="big num ${type === "out" ? "o" : "i"}" style="margin-bottom:4px">${won(total)}원</div>
      <div class="lbl" style="margin-bottom:10px">지난달보다 ${diff === 0 ? "같아요" : `<b class="${(diff > 0) === (type === "out") ? "o" : "i"}">${won(Math.abs(diff))}원 ${diff > 0 ? "많아요" : "적어요"}</b>`}</div></div>
      ${!rows.length ? `<div class="empty" style="padding:24px">이번 달 ${type === "out" ? "지출" : "수입"} 기록이 없어요</div>` :
      `<div class="bars">${rows.map(([cat, v]) => {
        const c = catOf(cat); const p = prev[cat] || 0; const dd = v - p;
        return `<div class="br">
          <span style="font-size:20px">${esc(c.icon)}</span>
          <span class="nm">${esc(c.name)}<small class="num">${Math.round((v / total) * 100)}%</small></span>
          <span class="vv num">${won(v)}원</span>
          <div class="track"><div class="fill" style="width:${Math.max(2, (v / max) * 100)}%;background:${color}"></div></div>
          <div class="dl num">지난달 ${won(p)}원${p || v ? ` · ${dd === 0 ? "변화 없음" : (dd > 0 ? "▲ " : "▼ ") + won(Math.abs(dd))}` : ""}</div>
        </div>`;
      }).join("")}</div>`}
    </div>
    <div class="card">
      <h3>최근 6개월<small>막대를 누르면 금액이 보여요</small></h3>
      <div class="legend"><span><i style="background:var(--out)"></i>지출</span><span><i style="background:var(--in)"></i>수입</span></div>
      <div class="chart" id="trend"></div>
    </div>`;
}

function mountTrend(d) {
  const box = $("#trend"); if (!box) return;
  const months = Array.from({ length: 6 }, (_, k) => addMonths(S.month, k - 5));
  const val = (m, t) => d.trend.find((x) => x.m === m && x.type === t)?.sum || 0;
  const data = months.map((m) => ({ m, out: val(m, "out"), inn: val(m, "in") }));
  const W = 340, H = 190, L = 34, B = 24, T = 8;
  const maxV = Math.max(1, ...data.flatMap((x) => [x.out, x.inn]));
  const step = niceStep(maxV / 3);
  const top = Math.ceil(maxV / step) * step;
  const y = (v) => T + (H - T - B) * (1 - v / top);
  const gw = (W - L) / 6, bw = Math.min(16, gw / 3.2);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 6개월 지출과 수입">`;
  for (let v = 0; v <= top; v += step) {
    s += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>`;
    s += `<text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${short(v)}</text>`;
  }
  const bar = (x, v, col) => {
    if (!v) return "";
    const h = Math.max(2, y(0) - y(v)), r = Math.min(4, h / 2), yy = y(0) - h;
    return `<path d="M${x},${y(0)} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + bw - r} Q${x + bw},${yy} ${x + bw},${yy + r} V${y(0)} Z" fill="${col}"/>`;
  };
  data.forEach((p, i) => {
    const cx = L + gw * i + gw / 2;
    s += `<g>${bar(cx - bw - 1, p.out, "var(--out)")}${bar(cx + 1, p.inn, "var(--in)")}</g>`;
    s += `<text x="${cx}" y="${H - 6}" text-anchor="middle" style="${p.m === S.month ? "font-weight:700;fill:var(--ink)" : ""}">${+p.m.slice(5)}월</text>`;
    s += `<rect data-i="${i}" x="${L + gw * i}" y="${T}" width="${gw}" height="${H - T}" fill="transparent"/>`;
  });
  s += `</svg><div class="tip" id="tip"></div>`;
  box.innerHTML = s;
  const tip = $("#tip", box);
  const show = (ev) => {
    const i = ev.target.getAttribute?.("data-i"); if (i == null) return;
    const p = data[i];
    tip.innerHTML = `<b>${monthLabel(p.m)}</b><br>지출 ${won(p.out)}원<br>수입 ${won(p.inn)}원`;
    const r = box.getBoundingClientRect(), sc = r.width / W;
    tip.style.left = Math.min(r.width - 70, Math.max(70, (L + gw * i + gw / 2) * sc)) + "px";
    tip.style.top = y(Math.max(p.out, p.inn)) * sc - 6 + "px";
    tip.style.display = "block";
  };
  box.addEventListener("pointerover", show);
  box.addEventListener("pointerdown", show);
  box.addEventListener("pointerleave", () => (tip.style.display = "none"));
}
function niceStep(x) {
  const p = Math.pow(10, Math.floor(Math.log10(Math.max(1, x))));
  const n = x / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p;
}

function statusOf(used, limit) {
  const r = used / limit;
  if (r > 1) return { col: "var(--bad)", txt: `⚠️ ${won(used - limit)}원 넘었어요` };
  if (r >= 0.8) return { col: "var(--warn)", txt: `⚡ ${won(limit - used)}원 남았어요` };
  return { col: "var(--good)", txt: `✓ ${won(limit - used)}원 남았어요` };
}

function viewBudget(d) {
  const b = d.budget || { total: 0, cats: {} };
  const out = totals(d.entries).out;
  const byCat = {};
  for (const e of d.entries) if (e.type === "out") byCat[e.cat] = (byCat[e.cat] || 0) + e.amount;
  const isNow = S.month === d.today.slice(0, 7);
  let main;
  if (!b.total) {
    main = `<div class="soon">한 달 예산을 정하면 얼마나 남았는지, 하루에 얼마씩 쓰면 되는지 알려 드려요.</div>
      <button class="btn ghost mt" data-act="budget">예산 정하기</button>`;
  } else {
    const st = statusOf(out, b.total);
    const left = b.total - out;
    const daysLeft = daysIn(S.month) - +d.today.slice(8) + 1;
    main = `<div class="summary"><div class="lbl">한 달 예산 ${won(b.total)}원 중</div>
      <div class="big num" style="margin:2px 0 0">${won(out)}원 썼어요</div></div>
      <div class="prog" role="progressbar" aria-valuenow="${Math.round((out / b.total) * 100)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${Math.min(100, (out / b.total) * 100)}%;background:${st.col}"></i></div>
      <div class="stat" style="color:${st.col}">${st.txt} <span style="color:var(--ink3);font-weight:500">(${Math.round((out / b.total) * 100)}%)</span></div>
      ${isNow && left > 0 ? `<div class="soon mt">남은 ${daysLeft}일 동안 하루 <b class="num" style="color:var(--ink)">${won(Math.floor(left / daysLeft))}원</b>씩 쓰면 돼요</div>` : ""}
      <button class="btn ghost mt" data-act="budget">예산 바꾸기</button>`;
  }
  const catRows = Object.entries(b.cats || {}).map(([cat, lim]) => {
    const c = catOf(cat); const used = byCat[cat] || 0; const st = statusOf(used, lim);
    return `<div style="padding:10px 0;border-top:1px solid var(--line)">
      <div style="display:flex;justify-content:space-between;font-size:14px"><b>${esc(c.icon)} ${esc(c.name)}</b><span class="num">${won(used)} / ${won(lim)}원</span></div>
      <div class="prog" style="height:8px;margin:7px 0 4px"><i style="width:${Math.min(100, (used / lim) * 100)}%;background:${st.col}"></i></div>
      <div class="stat" style="color:${st.col};font-size:12px">${st.txt}</div></div>`;
  }).join("");
  const fx = d.fixed || [];
  return `
    <div class="card"><h3>${monthLabel(S.month)} 예산</h3>${main}</div>
    ${catRows ? `<div class="card"><h3>분류별 예산</h3>${catRows}</div>` : ""}
    <div class="card">
      <h3>고정 지출·수입<small>매달 그 날짜가 되면 자동으로 적혀요</small></h3>
      ${fx.length ? fx.map((f) => {
        const c = catOf(f.cat);
        return `<div class="fx ${f.active ? "" : "off"}">
          <div class="d"><b>${f.day}</b>일</div>
          <button style="flex:1;text-align:left;min-width:0" data-fixed="${f.id}">
            <div style="font-weight:600">${esc(c.icon)} ${esc(f.title)}</div>
            <div class="num ${f.type === "in" ? "i" : "o"}" style="font-size:14px;font-weight:700">${f.type === "in" ? "+" : "−"}${won(f.amount)}원</div>
          </button>
          <button class="switch ${f.active ? "on" : ""}" data-toggle="${f.id}" aria-label="${f.active ? "끄기" : "켜기"}"></button>
        </div>`;
      }).join("") : `<div class="soon">관리비, 통신비, 보험료, 월급처럼 매달 같은 날 오가는 돈을 등록해 두세요.</div>`}
      <button class="addline" data-act="addfixed">+ 고정 항목 추가</button>
    </div>
    ${fx.length ? `<div class="card"><h3>매달 고정으로</h3><div class="sumrow">
      <div><div class="lbl">나가는 돈</div><div class="v num o">${won(fx.filter((f) => f.active && f.type === "out").reduce((a, f) => a + f.amount, 0))}원</div></div>
      <div><div class="lbl">들어오는 돈</div><div class="v num i">${won(fx.filter((f) => f.active && f.type === "in").reduce((a, f) => a + f.amount, 0))}원</div></div>
    </div></div>` : ""}`;
}

  </div>`;
  $("#startform").onsubmit = async (ev) => {
    ev.preventDefault();
    const btn = $("#go"); btn.disabled = true; $("#err").textContent = "";
    try {
      const body = { pass: $("#f-pass").value, member: $("#f-me").value.trim() };

      else r = await api("POST", "/api/join", { ...body, code: $("#f-code").value.trim() });

      save(LS_AUTH, S.auth);
      history.replaceState(null, "", location.pathname + location.search);
      S.tab = "list"; S.month = kstToday().slice(0, 7);
      render(); refresh();
      toast(mode === "new" ? "우리집 서랍을 만들었어요! 설정에서 가족을 초대해 보세요" : "환영해요!");
    } catch (e) { $("#err").textContent = e.message; btn.disabled = false; }

}

function openSheet(html, mount) {
  closeSheet(true);
  const dim = document.createElement("div"); dim.className = "dim";
  const sh = document.createElement("div"); sh.className = "sheet"; sh.setAttribute("role", "dialog");
  sh.innerHTML = `<div class="grab"></div>` + html;
  document.body.append(dim, sh);
  dim.onclick = () => closeSheet();
  requestAnimationFrame(() => { dim.classList.add("show"); sh.classList.add("show"); });
  $$("[data-close]", sh).forEach((b) => (b.onclick = () => closeSheet()));
  mount && mount(sh);
  history.pushState({ sheet: 1 }, "");
  return sh;
}
function closeSheet(quiet) {
  const sh = $(".sheet"), dim = $(".dim");
  if (!sh) return;
  sh.classList.remove("show"); dim.classList.remove("show");
  setTimeout(() => { sh.remove(); dim.remove(); }, 250);
  if (!quiet && history.state?.sheet) history.back();
}
window.addEventListener("popstate", () => { if ($(".sheet")) closeSheet(true); });

function amountInput(sh, initial) {
  const inp = $("#amt", sh);
  const fmt = (v) => (v ? Number(v).toLocaleString("ko-KR") : "");
  inp.value = fmt(initial);
  inp.addEventListener("input", () => {
    const raw = inp.value.replace(/[^0-9]/g, "").slice(0, 11).replace(/^0+/, "");
    inp.value = fmt(raw);
  });
  $$("[data-plus]", sh).forEach((b) => (b.onclick = () => {
    const cur = +inp.value.replace(/[^0-9]/g, "") || 0;
    inp.value = fmt(cur + +b.dataset.plus);
  }));
  return () => +inp.value.replace(/[^0-9]/g, "") || 0;
}
const QUICK = `<div class="quick">${[[1000, "+1천"], [10000, "+1만"], [50000, "+5만"], [100000, "+10만"]].map(([v, n]) => `<button type="button" data-plus="${v}">${n}</button>`).join("")}</div>`;

    };
    paint();
    sh.addEventListener("click", (ev) => {

      const c = ev.target.closest("[data-c]"); if (c) { st.cat = c.dataset.c; paint(); }

async function exportCSV() {
  try {
    const { entries } = await api("GET", "/api/entries");
    if (!entries.length) { toast("내려받을 기록이 없어요"); return; }
    const q = (s) => `"${String(s ?? "").replace(/"/g, '""')}"`;
    const lines = [["날짜", "구분", "분류", "금액", "결제", "메모", "적은 사람"].join(",")]
      .concat(entries.map((e) => [e.date, e.type === "in" ? "수입" : "지출", q(catOf(e.cat).name), e.amount, q(e.method), q(e.memo), q(e.member)].join(",")));
    const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `가계부_${kstToday()}.csv`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  } catch (e) { toast(e.message); }
}

document.addEventListener("click", async (ev) => {
  const el = ev.target.closest("[data-act],[data-tab],[data-filter],[data-stat],[data-edit],[data-fixed],[data-toggle],[data-delcat],[data-mode]");
  if (!el || el.closest(".sheet")) return;
  const ds = el.dataset;
  if (ds.mode) { renderStart.mode = ds.mode; render(); return; }
  if (ds.tab) { S.tab = ds.tab; render(); scrollTo(0, 0); return; }
  if (ds.filter) { S.filter = ds.filter; render(); return; }
  if (ds.stat) { S.statType = ds.stat; render(); return; }
  if (ds.edit) { const e = S.data.entries.find((x) => x.id === +ds.edit); if (e) entrySheet(e); return; }
  if (ds.fixed) { const f = S.data.fixed.find((x) => x.id === +ds.fixed); if (f) fixedSheet(f); return; }
  if (ds.toggle) {
    const f = S.data.fixed.find((x) => x.id === +ds.toggle); if (!f) return;
    f.active = f.active ? 0 : 1; render();
    try { await api("PUT", "/api/fixed/" + f.id, { ...f, active: !!f.active }); toast(f.active ? "다시 켰어요" : "꺼 두었어요 — 자동으로 안 적혀요"); }
    catch (e) { toast(e.message); refresh(); }
    return;
  }
  if (ds.delcat) {
    const c = catOf(ds.delcat);
    if (!confirm(`'${c.name}' 분류를 지울까요?\n이미 적은 기록은 '지운 분류'로 보여요.`)) return;
    try { await saveCategories(S.data.categories.filter((x) => x.id !== ds.delcat)); toast("지웠어요"); } catch (e) { toast(e.message); }
    return;
  }
  switch (ds.act) {
    case "prev": case "next": case "thism":
      S.month = ds.act === "thism" ? kstToday().slice(0, 7) : addMonths(S.month, ds.act === "prev" ? -1 : 1);
      if (S.data) S.data = { ...S.data, entries: [], trend: [], prevCats: [], month: null };
      render(); refresh(); break;
    case "add": entrySheet(null); break;
    case "install": doInstall(); break;
    case "addfixed": fixedSheet(null); break;
    case "budget": budgetSheet(); break;
    case "copylink": {
      const v = $("#linkbox").value;
      try { await navigator.clipboard.writeText(v); } catch { $("#linkbox").select(); document.execCommand("copy"); }
      toast("초대 링크를 복사했어요"); break;
    }
    case "share":
      navigator.share({ title: "우리집 서랍", text: `[우리집 서랍] '${S.data.family.name}'에 초대해요! 우리집 코드: ${S.data.family.code} (가족 암호는 따로 알려 줄게요)`, url: $("#linkbox").value }).catch(() => {});
      break;
    case "rename":
      simpleSheet("서랍 이름", `<div class="field"><input id="nm" maxlength="20" value="${esc(S.data.family.name)}"></div>`, async (sh) => {
        const r = await api("PUT", "/api/settings", { name: $("#nm", sh).value });
        S.data.family.name = r.name; S.auth.name = r.name; save(LS_AUTH, S.auth); render(); toast("바꿨어요");
      });
      break;
    case "addcat": {
      let t = "out";
      simpleSheet("분류 추가", `
        <div class="seg" id="ctseg"><button class="on" data-ct="out">지출</button><button data-ct="in">수입</button></div>
        <div class="two mt"><div style="flex:.3"><label class="lbl" style="font-size:13px;color:var(--ink2)">아이콘</label><input id="ci" maxlength="4" value="🐶" style="text-align:center;font-size:22px;margin-top:6px;padding:8px"></div>
        <div><label class="lbl" style="font-size:13px;color:var(--ink2)">이름</label><input id="cn" maxlength="12" placeholder="예) 반려동물" style="margin-top:6px"></div></div>
        <div class="soon" style="font-size:13px;margin-top:8px">아이콘은 휴대폰 이모지 키보드로 바꿀 수 있어요.</div>`, async (sh) => {
        const name = $("#cn", sh).value.trim(); if (!name) throw new Error("이름을 적어 주세요");
        await saveCategories(S.data.categories.concat({ id: "c" + Date.now().toString(36), name, icon: $("#ci", sh).value.trim() || "📦", type: $("#ctseg .on", sh)?.dataset.ct || t }));
        toast("추가했어요");
      });
      const sh = $(".sheet");
      $$("[data-ct]", sh).forEach((b) => (b.onclick = () => { $$("[data-ct]", sh).forEach((x) => x.classList.toggle("on", x === b)); }));
      break;
    }
    case "csv": exportCSV(); break;
    case "pass":
      simpleSheet("가족 암호 바꾸기", `
        <div class="field"><label for="po">지금 암호</label><input id="po" type="password" autocomplete="current-password"></div>
        <div class="field"><label for="pn">새 암호 (4자 이상)</label><input id="pn" type="password" autocomplete="new-password"></div>
        <div class="soon" style="font-size:13px">바꾸면 다른 가족의 휴대폰은 새 암호로 다시 들어와야 해요.</div>`, async (sh) => {
        await api("PUT", "/api/password", { old: $("#po", sh).value, pass: $("#pn", sh).value });
        toast("암호를 바꿨어요. 가족에게 새 암호를 알려 주세요");
      });
      break;
    case "logout":
      if (confirm("이 기기에서 나갈까요?\n기록은 그대로 남고, 코드와 암호로 다시 들어올 수 있어요.")) logout(false);
      break;
  }
});

    const c = load("fb.cache." + S.auth.code);
    if (c && c.month === S.month) S.data = c.data;
    const join = (location.hash.match(/join=([A-Za-z0-9]{6})/) || [])[1];
    if (join && join.toUpperCase() !== S.auth.code) {
      if (confirm(`다른 서랍(${join.toUpperCase()}) 초대 링크예요.\n지금 서랍에서 나가고 그쪽으로 들어갈까요?`)) {
        renderStart.mode = "join"; logout(false); return;
      }
    }
    history.replaceState(null, "", location.pathname + location.search);
    render(); refresh();
  } else render();
  document.addEventListener("visibilitychange", () => { if (!document.hidden && S.auth) refresh(); });
})();
</script>
</body>
</html>
